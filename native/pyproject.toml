[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-music-native"
version = "0.1.0"
description = "A portable native YouTube Music client"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "ytmusicapi>=1.12.3,<2",
  "yt-dlp[default]>=2026.8.19",
  "python-mpv>=1.0.8,<2",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
youtube-music-native-check = "youtube_music_native.compat:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
