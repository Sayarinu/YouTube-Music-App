[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-music-native"
version = "0.1.1"
description = "Tubify, a portable native client for YouTube Music"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "PySide6>=6.8,<7",
  "keyring>=25.7,<26",
  "ytmusicapi>=1.12.3,<2",
  "yt-dlp[default]>=2026.8.19",
  "python-mpv>=1.0.8,<2",
  "jeepney>=0.9,<1; sys_platform == 'linux'",
  "pyobjc-framework-Cocoa>=11; sys_platform == 'darwin'",
  "pyobjc-framework-MediaPlayer>=11; sys_platform == 'darwin'",
  "winrt-runtime>=3.2.1,<4; sys_platform == 'win32'",
  "winrt-Windows.Media>=3.2.1,<4; sys_platform == 'win32'",
  "winrt-Windows.Media.Interop>=3.2.1,<4; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = ["pytest>=8"]
macos-build = ["pyinstaller>=6.10"]
windows-build = ["pyinstaller>=6.10"]

[project.scripts]
youtube-music-native = "youtube_music_native.launcher:main"
youtube-music-native-check = "youtube_music_native.launcher:compat_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
youtube_music_native = ["qml/*.qml", "qml/*.js", "assets/*", "assets/overlay/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
