[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-music-native"
version = "0.1.0"
description = "A portable native YouTube Music client"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "PySide6>=6.8,<7",
  "keyring>=25.7,<26",
  "ytmusicapi>=1.12.3,<2",
  "yt-dlp[default]>=2026.8.19",
  "python-mpv>=1.0.8,<2",
  "jeepney>=0.9,<1; sys_platform == 'linux'",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
youtube-music-native = "youtube_music_native.launcher:main"
youtube-music-native-check = "youtube_music_native.launcher:compat_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
youtube_music_native = ["qml/*.qml", "qml/*.js", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
