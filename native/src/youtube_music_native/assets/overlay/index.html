<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer"><title>YouTube Music · Now playing</title>
<link rel="stylesheet" href="overlay.css"><script defer src="overlay.js"></script>
</head>
<body>
<main id="overlay" class="overlay" aria-label="Now playing">
  <article id="card" class="card">
    <div id="artwork" class="artwork" aria-hidden="true"><img id="cover" alt=""><span class="placeholder">♪</span></div>
    <section class="metadata">
      <div class="eyebrow"><span class="pulse"></span><span id="state">CONNECTING</span></div>
      <div class="ticker-clip"><div id="ticker"><h1 id="title">YouTube Music</h1><p id="artist"></p></div></div>
      <div id="progress" class="progress"><div class="rail"><div id="fill"></div></div><div class="times"><span id="elapsed">0:00</span><span id="duration">0:00</span></div></div>
    </section>
  </article>
  <p id="notice" class="notice" role="status"></p>
  <span id="preview" class="preview" hidden>Preview · synthetic content</span>
</main>
</body>
</html>
