name: Native client checks

on:
  pull_request:
    paths:
      - 'native/**'
      - 'packaging/macos-native/**'
      - 'packaging/windows-native/**'
      - 'packaging/arch-native/**'
      - 'scripts/build-native-arch-package.sh'
      - 'scripts/check-native-arch-package.sh'
      - '.github/workflows/native-arch-build.yml'
      - '.github/workflows/native-release-linux.yml'
      - 'scripts/build-native-macos.sh'
      - 'scripts/build-native-windows.ps1'
      - 'scripts/build-native-windows-icon.py'
      - 'scripts/check-native-windows.ps1'
      - '.github/workflows/native.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arch-app:
    name: Arch Linux packages
    uses: ./.github/workflows/native-arch-build.yml

  shared-code:
    name: Shared code (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12']
        include:
          - os: ubuntu-latest
            python: '3.14'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: native/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install shared Python package
        run: python -m pip install -e './native[test]'
      - name: Install native player on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libmpv2 ffmpeg
      - name: Install native player on macOS
        if: runner.os == 'macOS'
        run: brew install mpv ffmpeg
      - name: Locate native player on macOS
        if: runner.os == 'macOS'
        run: echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
      - name: Install native player on Windows
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-mpv mingw-w64-ucrt-x86_64-ffmpeg
      - name: Locate native player on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $mpvDllDirectory = Join-Path $env:MSYS2_LOCATION 'ucrt64\bin'
          Add-Content -Path $env:GITHUB_ENV -Value "PATH=$env:PATH;$mpvDllDirectory"
      - name: Test imports, session validation and isolated playback dispatch
        run: python -m pytest native/tests -q
      - name: Check portable command entry point
        run: youtube-music-native-check --help
      - name: Launch native Qt window and decode local audio
        shell: bash
        run: |
          python native/tests/smoke_runtime.py || {
            echo "Native runtime smoke failed; retrying once to rule out transient runner startup failures."
            python native/tests/smoke_runtime.py
          }
      - name: Verify authenticated local API through the native settings UI
        run: python native/tests/smoke_local_api.py --ui-scale 150
      - name: Verify MPRIS on an isolated session bus
        if: runner.os == 'Linux'
        run: dbus-run-session -- python native/tests/smoke_desktop.py

  macos-app:
    name: macOS app bundle (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build Tubify.app and disk image
        run: scripts/build-native-macos.sh
      - name: Check the bundle runs without Homebrew on PATH
        run: |
          app="dist/native/Tubify-macos-arm64.app/Contents/MacOS/Tubify"
          test "$(lipo -archs "$app")" = arm64
          codesign --verify --deep --strict dist/native/Tubify-macos-arm64.app
          "$(brew --prefix)/bin/ffmpeg" -loglevel error -f lavfi -i sine=d=3 "$RUNNER_TEMP/tone.wav"
          finder_env=(env -i HOME="$HOME" TMPDIR="$RUNNER_TEMP/" PATH=/usr/bin:/bin)
          printf '{"source": "%s"}' "$RUNNER_TEMP/tone.wav" | "${finder_env[@]}" "$app" --player-worker
          "${finder_env[@]}" QT_QPA_PLATFORM=offscreen "$app" --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: tubify-macos-arm64
          path: dist/native/Tubify-*-macos-arm64.dmg
          if-no-files-found: error

  windows-app:
    name: Windows app installer (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install MPV and FFmpeg for UCRT64
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-mpv mingw-w64-ucrt-x86_64-ffmpeg
      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build the Tubify installer
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: ./scripts/build-native-windows.ps1
      - name: Verify install, upgrade, launch, and uninstall
        shell: pwsh
        run: ./scripts/check-native-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: tubify-windows-x64-installer
          path: dist/native/Tubify-*-windows-x64-setup.exe
          if-no-files-found: error

  release-assets:
    name: Assemble and verify all release downloads
    needs: [shared-code, windows-app, macos-app, arch-app, streamdeck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tubify-windows-x64-installer
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: tubify-macos-arm64
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: native-arch-package
          path: release
      # The plugin is platform-independent; all three matrix builds are tested.
      - uses: actions/download-artifact@v4
        with:
          name: streamdeck-windows-latest
          path: release
      - name: Require every download type and generate checksums
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          shopt -s failglob
          assets=( *.exe *.dmg *.pkg.tar.zst *.src.tar.gz *.streamDeckPlugin )
          sha256sum "${assets[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release-downloads
          path: release/*
          if-no-files-found: error

  release:
    name: Publish downloadable main release
    needs: release-assets
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-release-downloads
          path: release
      - name: Publish verified installers and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="main-build-${GITHUB_RUN_ID}"
          cd release
          sha256sum --check SHA256SUMS
          shopt -s failglob
          assets=( *.exe *.dmg *.pkg.tar.zst *.src.tar.gz *.streamDeckPlugin SHA256SUMS )
          printf 'Verified build of main commit `%s`.\n\nDownloads:\n- Windows: setup.exe\n- macOS Apple Silicon: arm64.dmg\n- Arch Linux: pkg.tar.zst (install with pacman -U)\n- Arch build sources: src.tar.gz\n- Stream Deck for Windows/macOS: streamDeckPlugin\n- Integrity checks: SHA256SUMS\n\n[Build and verification](https://github.com/%s/actions/runs/%s)\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > notes.md
          if gh release view "$tag" --json isDraft --jq .isDraft > existing-draft 2>/dev/null; then
            if [ "$(cat existing-draft)" = false ]; then
              echo "This build is already published."
              exit 0
            fi
          else
            gh release create "$tag" --target "$GITHUB_SHA" --draft --title "Tubify main build ${GITHUB_RUN_NUMBER}" --notes-file notes.md
          fi
          gh release upload "$tag" "${assets[@]}" --clobber
          latest=false
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA" ]; then
            latest=true
          fi
          gh release edit "$tag" --draft=false --latest="$latest"

  streamdeck:
    name: Stream Deck (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: native/integrations/streamdeck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: native/integrations/streamdeck/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run validate
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: streamdeck-${{ matrix.os }}
          path: native/integrations/streamdeck/dist/*.streamDeckPlugin
