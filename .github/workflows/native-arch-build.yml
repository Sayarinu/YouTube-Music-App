name: Build verified native Arch packages

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-native-arch:
    name: Native Arch install and upgrade
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate native release gate
        if: startsWith(github.ref, 'refs/tags/native-v')
        run: |
          test "${GITHUB_REF_NAME#native-v}" = "$(python -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("native/pyproject.toml").read_text())["project"]["version"])')"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python native/release_gate.py
      - name: Build, install, launch and upgrade in clean Arch
        run: |
          docker run --rm --volume "${GITHUB_WORKSPACE}:/workspace" --workdir /workspace archlinux:latest bash -lc '
            set -euo pipefail
            pacman -Syu --noconfirm --needed base-devel git
            source packaging/arch-native/PKGBUILD
            pacman -S --noconfirm --needed "${depends[@]}" "${makedepends[@]}" "${checkdepends[@]}"
            useradd --create-home builder
            chown -R builder:builder /workspace
            runuser -u builder -- ./scripts/build-native-arch-package.sh --noconfirm
            packages=(/workspace/dist/native/*.pkg.tar.zst)
            sources=(/workspace/dist/native/*.src.tar.gz)
            ./scripts/check-native-arch-package.sh "${packages[0]}" "${sources[0]}"
          '
      - uses: actions/upload-artifact@v4
        with:
          name: native-arch-package
          path: |
            dist/native/*.pkg.tar.zst
            dist/native/*.src.tar.gz
          if-no-files-found: error
