name: Build and Release Arch Linux

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arch:
    name: Build Arch package
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"

      - name: Build native Arch package
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            archlinux:latest \
            bash -lc '
              set -euo pipefail
              pacman -Syu --noconfirm --needed \
                base-devel \
                git \
                nodejs \
                npm \
                rust \
                pkgconf \
                webkit2gtk-4.1 \
                librsvg \
                libayatana-appindicator \
                gst-plugins-good \
                gst-plugins-bad \
                gst-libav
              useradd --create-home builder
              chown -R builder:builder /workspace
              su --shell /bin/bash builder --command "./scripts/build-arch-package.sh"
              ./scripts/doctor-arch-media.sh
            '

      - name: Upload Arch package
        uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: dist/*.pkg.tar.zst
          if-no-files-found: error

  release:
    name: Publish Arch package
    needs: build-arch
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download Arch package
        uses: actions/download-artifact@v4
        with:
          name: arch-package
          path: release

      - name: Create checksums
        working-directory: release
        run: sha256sum *.pkg.tar.zst > SHA256SUMS

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.pkg.tar.zst
            release/SHA256SUMS
